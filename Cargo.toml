[package]
name = "valkey-largeobj"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Valkey Large Object Module — NVMe + EFA storage for KV cache tensors"
repository = "https://github.com/KarthikSubbarao/ValkeyLargeObj"

[dependencies]
valkey-module = { version = "0.1.5", features = ["min-valkey-compatibility-version-8-0"] }
valkey-module-macros = "0"
linkme = "0"
libc = "0.2"
crc32c = "0.6"
io-uring = "0.7"
crossbeam-channel = "0.5"
talc = { version = "4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
lazy_static = "1"

[dev-dependencies]
rstest = "0.23.0"

[lib]
crate-type = ["cdylib"]
name = "valkey_largeobj"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0
debug = 2

[features]
default = []
enable-system-alloc = ["valkey-module/enable-system-alloc"]
## Enable real EFA/libfabric support. Requires libfabric-dev installed.
## Build with: cargo build --release --features efa
## Without this feature, EFA registration is a no-op (graceful fallback).
efa = []
