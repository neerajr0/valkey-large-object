name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  SERVER_VERSION: unstable
  VALKEY_REPO_URL: https://github.com/valkey-io/valkey.git
  TEST_FRAMEWORK_REPO: https://github.com/valkey-io/valkey-test-framework
  TEST_FRAMEWORK_DIR: tests/build/valkeytestframework

jobs:
  # ─── Lint + Build + Unit Tests + Integration Tests ────────────────────────
  build-and-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # System deps (AL2023)
          sudo yum install -y clang clang-devel gcc make git

      - name: Install Rust
        run: |
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: cargo fmt check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --profile release --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --features enable-system-alloc

      - name: Get week number
        id: week
        run: echo "week=$(date +%V)" >> $GITHUB_OUTPUT

      - name: Cache valkey-server and test framework
        id: cache-valkey
        uses: actions/cache@v4
        with:
          path: |
            tests/build/binaries
            tests/build/valkeytestframework
          key: valkey-unstable-normal-w${{ steps.week.outputs.week }}

      - name: Build valkey-server
        if: steps.cache-valkey.outputs.cache-hit != 'true'
        run: |
          mkdir -p tests/build/binaries/unstable
          cd tests/build
          git clone "${{ env.VALKEY_REPO_URL }}"
          cd valkey
          git checkout unstable
          make -j
          cp src/valkey-server ../binaries/unstable/
          cd ../..
          rm -rf valkey

      - name: Set up test framework
        if: steps.cache-valkey.outputs.cache-hit != 'true'
        run: |
          git clone ${{ env.TEST_FRAMEWORK_REPO }}
          mkdir -p ${{ env.TEST_FRAMEWORK_DIR }}
          mv valkey-test-framework/src/* ${{ env.TEST_FRAMEWORK_DIR }}/
          rm -rf valkey-test-framework

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set module path
        run: echo "MODULE_PATH=$(realpath target/release/libvalkey_largeobj.so)" >> $GITHUB_ENV

      - name: Run integration tests
        run: python -m pytest --cache-clear -v "tests/"

  # ─── Lint + Build + ASAN Integration Tests ────────────────────────────────
  asan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          # System deps (AL2023)
          sudo yum install -y clang clang-devel gcc make git

      - name: Install Rust
        run: |
          if ! command -v cargo &> /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: cargo fmt check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --profile release --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release

      - name: Run unit tests
        run: cargo test --features enable-system-alloc

      - name: Get week number
        id: week
        run: echo "week=$(date +%V)" >> $GITHUB_OUTPUT

      - name: Cache valkey-server (ASAN) and test framework
        id: cache-valkey
        uses: actions/cache@v4
        with:
          path: |
            tests/build/binaries
            tests/build/valkeytestframework
          key: valkey-unstable-asan-w${{ steps.week.outputs.week }}

      - name: Build valkey-server with ASAN
        if: steps.cache-valkey.outputs.cache-hit != 'true'
        run: |
          mkdir -p tests/build/binaries/unstable
          cd tests/build
          git clone "${{ env.VALKEY_REPO_URL }}"
          cd valkey
          git checkout unstable
          make distclean
          make -j SANITIZER=address
          cp src/valkey-server ../binaries/unstable/
          cd ../..
          rm -rf valkey

      - name: Set up test framework
        if: steps.cache-valkey.outputs.cache-hit != 'true'
        run: |
          git clone ${{ env.TEST_FRAMEWORK_REPO }}
          mkdir -p ${{ env.TEST_FRAMEWORK_DIR }}
          mv valkey-test-framework/src/* ${{ env.TEST_FRAMEWORK_DIR }}/
          rm -rf valkey-test-framework

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set module path
        run: echo "MODULE_PATH=$(realpath target/release/libvalkey_largeobj.so)" >> $GITHUB_ENV

      - name: Run integration tests with ASAN
        env:
          ASAN_BUILD: "1"
        run: |
          python -m pytest --capture=sys --cache-clear -v "tests/" 2>&1 | tee test_output.tmp
          if grep -q "LeakSanitizer: detected memory leaks" test_output.tmp; then
            echo "::error::Memory leaks detected by AddressSanitizer"
            grep -B 2 "LeakSanitizer: detected memory leaks" test_output.tmp
            rm test_output.tmp
            exit 1
          fi
          rm test_output.tmp
